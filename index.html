<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus API Core - Interactive Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
      --success-color: #10b981;
      --error-color: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    h1 {
      margin: 0;
      color: var(--accent-color);
      font-size: 1.8rem;
    }

    .btn-docs {
      background-color: var(--success-color);
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }

    .btn-docs:hover {
      background-color: #059669;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 0.4rem;
    }

    input, select {
      width: 100%;
      padding: 0.6rem;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      padding: 0.7rem;
      background-color: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      font-size: 0.95rem;
    }

    button:hover {
      background-color: #0369a1;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    pre {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      color: #a5f3fc;
      overflow-x: auto;
      font-size: 0.9rem;
      max-height: 350px;
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-left: 0.5rem;
    }

    .badge-200 { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-400 { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>🚀 Nexus API Core</h1>
        <p style="margin: 0.3rem 0 0; color: var(--text-sub); font-size: 0.9rem;">Interactive RESTful API Web Interface</p>
      </div>
      <a href="/api-docs" target="_blank" class="btn-docs">📖 Swagger Docs</a>
    </header>

    <div class="grid">
      <!-- Create User (POST) -->
      <div class="card">
        <h2>Create User <span style="font-size: 0.8rem; color: #38bdf8;">[POST /api/v1/users]</span></h2>
        <div class="form-group">
          <label for="userName">Full Name</label>
          <input type="text" id="userName" placeholder="e.g. John Doe">
        </div>
        <div class="form-group">
          <label for="userEmail">Email Address</label>
          <input type="email" id="userEmail" placeholder="e.g. john@example.com">
        </div>
        <div class="form-group">
          <label for="userRole">Role</label>
          <select id="userRole">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button onclick="createUser()">Send POST Request</button>
      </div>

      <!-- Fetch Actions (GET) -->
      <div class="card">
        <h2>Fetch Actions <span style="font-size: 0.8rem; color: #34d399;">[GET]</span></h2>
        <div class="form-group">
          <label>Fetch All Users</label>
          <button onclick="fetchUsers()" style="background-color: #334155;">GET /api/v1/users</button>
        </div>
        <div class="form-group" style="margin-top: 1.5rem;">
          <label for="userId">Fetch User by ID</label>
          <input type="number" id="userId" placeholder="Enter User ID (e.g. 1)" style="margin-bottom: 0.5rem;">
          <button onclick="fetchUserById()" style="background-color: #334155;">GET /api/v1/users/:id</button>
        </div>
      </div>

      <!-- Live Terminal Output -->
      <div class="card full-width">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="margin: 0;">API Response Terminal</h2>
          <div id="statusBadgeContainer"></div>
        </div>
        <pre id="jsonOutput">// Click any action above to send a request to your API...</pre>
      </div>
    </div>
  </div>

  <script>
    const output = document.getElementById('jsonOutput');
    const badgeContainer = document.getElementById('statusBadgeContainer');

    function updateTerminal(data, status) {
      badgeContainer.innerHTML = `<span class="status-badge ${status >= 200 && status < 300 ? 'badge-200' : 'badge-400'}">HTTP ${status}</span>`;
      output.innerText = JSON.stringify(data, null, 2);
    }

    async function fetchUsers() {
      output.innerText = "// Requesting GET /api/v1/users ...";
      try {
        const res = await fetch('/api/v1/users');
        const data = await res.json();
        updateTerminal(data, res.status);
      } catch (err) {
        updateTerminal({ error: err.message }, 500);
      }
    }

    async function fetchUserById() {
      const id = document.getElementById('userId').value;
      if (!id) {
        alert("Please enter a User ID");
        return;
      }
      output.innerText = `// Requesting GET /api/v1/users/${id} ...`;
      try {
        const res = await fetch(`/api/v1/users/${id}`);
        const data = await res.json();
        updateTerminal(data, res.status);
      } catch (err) {
        updateTerminal({ error: err.message }, 500);
      }
    }

    async function createUser() {
      const name = document.getElementById('userName').value;
      const email = document.getElementById('userEmail').value;
      const role = document.getElementById('userRole').value;

      output.innerText = "// Sending POST /api/v1/users ...";
      try {
        const res = await fetch('/api/v1/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, role })
        });
        const data = await res.json();
        updateTerminal(data, res.status);
      } catch (err) {
        updateTerminal({ error: err.message }, 500);
      }
    }
  </script>
</body>
</html>
